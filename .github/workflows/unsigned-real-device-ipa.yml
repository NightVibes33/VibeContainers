# Diagnostics are uploaded on every attempt so failed device builds are actionable.
name: Unsigned Real Device IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: unsigned-real-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Patch, build, and validate unsigned iPhoneOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_installer_fixes.py
          python3 scripts/apply_installer_followups.py
          python3 scripts/apply_xcode26_fixes.py
          python3 scripts/apply_virtual_host_lock.py
          python3 scripts/apply_exact_appwindow_guest_control_v10.py
          python3 scripts/apply_home_layout_persistence.py

          # A restored custom layout must never be auto-packed back into Dock.
          if grep -Fq 'if fillDockFromPages() { persist() }' iOSSim/Model/HomeLayoutStore.swift; then
            echo "Launch-time Dock refill is still present" >&2
            exit 1
          fi
          if grep -Fq '        fillDockFromPages()' iOSSim/Model/HomeLayoutStore.swift; then
            echo "Guest-sync Dock refill is still present" >&2
            exit 1
          fi

          # There must be exactly one bottom-control implementation, in the
          # Springboard app target. AppWindow and real guests both use it.
          test "$(grep -R --include='*.swift' -l 'struct SpringboardBottomControlModifier: ViewModifier' iOSSim LiveContainer-3.8.0 | wc -l | tr -d ' ')" = "1"
          grep -Fq 'struct SpringboardBottomControlModifier: ViewModifier' iOSSim/Springboard/AppWindow.swift
          grep -Fq '.padding(.bottom, max(7, bottomInset > 0 ? 7 : 11))' iOSSim/Springboard/AppWindow.swift
          grep -Fq 'DragGesture(minimumDistance: 12, coordinateSpace: .global)' iOSSim/Springboard/AppWindow.swift
          grep -Fq 'value.startLocation.y > screenHeight - 70' iOSSim/Springboard/AppWindow.swift
          grep -Fq 'elapsed >= 0.34, upwardTravel >= 28, upwardTravel < 165' iOSSim/Springboard/AppWindow.swift
          grep -Fq 'upwardTravel >= 64 || predictedUpwardTravel >= 150' iOSSim/Springboard/AppWindow.swift
          grep -Fq 'SpringboardBottomControlModifier(' iOSSim/Model/RunningContainerStore.swift
          grep -Fq 'VibeContainers.ExactAppWindowGuestControlHost' iOSSim/Model/RunningContainerStore.swift
          grep -Fq 'exact AppWindow Springboard control hosted full-screen' iOSSim/Model/RunningContainerStore.swift
          grep -Fq 'UIPanGestureRecognizer(target: self, action: #selector(handleBottomPan(_:)))' iOSSim/Model/RunningContainerStore.swift
          grep -Fq 'controller.view.isUserInteractionEnabled = false' iOSSim/Model/RunningContainerStore.swift

          # LiveContainer owns guest lifecycle only. It must not draw/classify a
          # second bar; it merely tells the app-target control when to appear.
          grep -Fq 'IOSSimGuestSpringboardControlVisibility' LiveContainer-3.8.0/MultitaskSupport/MultitaskDockView.swift
          grep -Fq '@objc public func presentAppSwitcherLikeSpringboard()' LiveContainer-3.8.0/MultitaskSupport/MultitaskDockView.swift
          grep -Fq '@objc(cycleAppLikeSpringboard:)' LiveContainer-3.8.0/MultitaskSupport/MultitaskDockView.swift
          grep -Fq 'rootView.sendSubviewToBack(windowHostingView)' LiveContainer-3.8.0/MultitaskSupport/MultitaskDockView.swift
          if grep -Eq 'GuestSpringboardBottomControl|systemGestureHostingController|handleSystemGesture\(_ gesture: UIPanGestureRecognizer\)' LiveContainer-3.8.0/MultitaskSupport/MultitaskDockView.swift; then
            echo "A duplicate framework-owned guest control still exists" >&2
            exit 1
          fi

      - name: Persist source fixes to main
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            iOSSim/Model/GuestInstaller.swift
            iOSSim/Model/PackageStore.swift
            iOSSim/Model/RunningContainerStore.swift
            iOSSim/Model/MultitaskPreferences.swift
            iOSSim/Model/HomeLayoutStore.swift
            iOSSim/Apps/PackagesView.swift
            iOSSim/Apps/GuestContainerView.swift
            iOSSim/Model/ZipArchive.swift
            iOSSim/Apps/SettingsIcons.swift
            iOSSim/Springboard/AppWindow.swift
            iOSSim/Springboard/PageTransition.swift
            iOSSim/Springboard/SpringboardView.swift
            iOSSim/Runtime/MultitaskBridge.m
            LiveContainer-3.8.0/LiveContainerSwiftUI/Utilities/LCUtils.m
            LiveContainer-3.8.0/MultitaskSupport/DecoratedAppSceneViewController.m
            LiveContainer-3.8.0/MultitaskSupport/MultitaskDockView.swift
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo "Source already contains the fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add -- "${FILES[@]}"
          git commit -m "Persist exact AppWindow guest control [skip ci]"
          git push origin HEAD:main

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Smoke test IPA ZIP extraction
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/test_zip_archive.sh
          scripts/test_zip_archive.sh

      - name: Build unsigned physical-device IPA
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/build_ipa.sh scripts/prepare_dependencies.sh
          scripts/build_ipa.sh \
            --unsigned \
            --configuration Release \
            --derived-data "$RUNNER_TEMP/VibeContainersDerivedData" \
            --output "$RUNNER_TEMP/VibeContainers-unsigned-real-device.ipa" \
            2>&1 | tee "$RUNNER_TEMP/vibecontainers-build.log"
          status=${PIPESTATUS[0]}
          grep -E '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|Command .* failed|The following build commands failed' \
            "$RUNNER_TEMP/vibecontainers-build.log" | tail -n 250 > "$RUNNER_TEMP/vibecontainers-build-errors.txt" || true
          exit "$status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VibeContainers-build-diagnostics
          path: |
            ${{ runner.temp }}/vibecontainers-build.log
            ${{ runner.temp }}/vibecontainers-build-errors.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Validate device payload and unsigned state
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/VibeContainers-unsigned-real-device.ipa"
          CHECK="$RUNNER_TEMP/VibeContainersIPAValidation"
          rm -rf "$CHECK"
          mkdir -p "$CHECK"
          unzip -tq "$IPA"
          unzip -q "$IPA" -d "$CHECK"

          APP="$CHECK/Payload/iOSSim.app"
          BIN="$APP/iOSSim"
          LC_FRAMEWORK="$APP/Frameworks/LiveContainerSwiftUI.framework/LiveContainerSwiftUI"
          test -d "$APP"
          test -f "$BIN"
          test -f "$LC_FRAMEWORK"

          if find "$APP" -name embedded.mobileprovision -o -name '*.p12' -o -name '*.pfx' | grep -q .; then
            echo "Signing material unexpectedly present in unsigned IPA" >&2
            exit 1
          fi
          if find "$APP" -type d -name _CodeSignature | grep -q .; then
            echo "Code signature directory unexpectedly present in unsigned IPA" >&2
            exit 1
          fi
          if /usr/bin/codesign --display "$BIN" >/dev/null 2>&1; then
            echo "Main executable is still signed" >&2
            exit 1
          fi

          /usr/bin/file "$BIN"
          /usr/bin/file "$BIN" | grep -qi 'arm64'
          xcrun vtool -show-build "$BIN" | tee "$RUNNER_TEMP/vtool.txt"
          grep -Eqi 'platform[[:space:]]+(IOS|2)' "$RUNNER_TEMP/vtool.txt"

          # Prove the exact control lives in the app binary and the framework
          # only ships the lifecycle/visibility bridge.
          strings "$BIN" | grep -F 'VibeContainers.ExactAppWindowGuestControlHost'
          strings "$BIN" | grep -F 'VibeContainers: exact AppWindow Springboard control hosted full-screen'
          strings "$BIN" | grep -F 'IOSSimGuestSpringboardControlVisibility'
          strings "$LC_FRAMEWORK" | grep -F 'IOSSimGuestSpringboardControlVisibility'
          strings "$LC_FRAMEWORK" | grep -F 'VibeContainers: Springboard-matched guest switcher committed after 230 ms'
          strings "$LC_FRAMEWORK" | grep -F 'VibeContainers: Springboard-matched guest cycle committed after 230 ms'
          strings "$LC_FRAMEWORK" | grep -F 'VibeContainers: guest host demoted below SwiftUI switcher'
          strings "$LC_FRAMEWORK" | grep -F 'per-window bottom grabber disabled; host owns bottom gestures'
          strings "$LC_FRAMEWORK" | grep -F 'VibeContainers: FORCED virtual-window guest host'
          strings "$LC_FRAMEWORK" | grep -F 'VibeContainers: rebound guest UIView'
          strings "$LC_FRAMEWORK" | grep -F 'hiding guest surfaces registered='
          strings "$LC_FRAMEWORK" | grep -F 'VibeContainers: Dock hosting controller ready'
          strings "$LC_FRAMEWORK" | grep -F 'VibeContainers: Home gesture committed immediately'
          strings "$BIN" | grep -F 'VibeContainers: migrating saved multitask mode'

          if strings "$LC_FRAMEWORK" | grep -E 'GuestSpringboardBottomControl|exact Springboard SwiftUI guest control installed|bottom gesture cancelled; using cached translation|handleSystemGesture' >/dev/null; then
            echo "A legacy/duplicate framework guest control is still shipped" >&2
            exit 1
          fi
          if { strings "$LC_FRAMEWORK"; strings "$BIN"; } | grep -E 'multitaskSwipeGesture|handleMultitaskSwipeGesture|minimumNumberOfTouches = 4|maximumNumberOfTouches = 5|MagnificationGesture' >/dev/null; then
            echo "Forbidden multi-finger/pinch gesture implementation found" >&2
            exit 1
          fi
          if strings "$BIN" | grep -F 'Use the floating dock to switch, resize, minimize or close it.' >/dev/null; then
            echo "Legacy floating-dock launch guidance is still shipped" >&2
            exit 1
          fi

          shasum -a 256 "$IPA" | tee "$RUNNER_TEMP/VibeContainers-unsigned-real-device.ipa.sha256"

      - name: Upload unsigned real-device IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeContainers-unsigned-real-device-ipa
          path: |
            ${{ runner.temp }}/VibeContainers-unsigned-real-device.ipa
            ${{ runner.temp }}/VibeContainers-unsigned-real-device.ipa.sha256
          if-no-files-found: error
          retention-days: 30
